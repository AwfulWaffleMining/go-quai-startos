name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools-ng jq

      - name: Install start-cli
        run: |
          ASSET="start-cli_$(uname -m)-linux"
          URL=$(curl -fsS https://api.github.com/repos/Start9Labs/start-os/releases \
            | jq -r '[.[].assets[] | select(.name=="'"$ASSET"'")] | first | .browser_download_url')
          curl -fsSL "$URL" -o /tmp/start-cli
          sudo install -m 755 /tmp/start-cli /usr/local/bin/start-cli
          start-cli --version

      - name: Developer signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          mkdir -p ~/.startos
          if [ -n "$DEV_KEY" ]; then
            printf '%s' "$DEV_KEY" > ~/.startos/developer.key.pem
          else
            start-cli init-key
          fi

      - name: Type-check and build
        run: |
          npm ci
          make
          sha256sum *.s9pk

      - uses: actions/upload-artifact@v4
        with:
          name: go-quai-s9pk
          path: '*.s9pk'
          retention-days: 14
          compression-level: 0
