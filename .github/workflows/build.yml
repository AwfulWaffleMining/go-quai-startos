name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Start9's shared package build: installs start-cli from the
    # start-technologies monorepo, provisions the packaging-workspace build key,
    # builds with Docker, and uploads the .s9pk as an artifact.
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    secrets:
      # Optional. Without it the build signs with a throwaway key.
      DEV_KEY: ${{ secrets.DEV_KEY }}
